name: make-your-game

services:
  make-your-game:
    build: .
    # Default image (AMD/x86_64).
    image: elmehdirezoug/make-your-game:1.0.0
    # For ARM/arm64 machines use: elmehdirezoug/make-your-game-arm:1.0.0
    container_name: make-your-game
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Security hardening
    user: "10001:10001"
    read_only: true
    cap_drop:
     - ALL
    security_opt:
     - no-new-privileges:true
