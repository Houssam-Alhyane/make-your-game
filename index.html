<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="shortcut icon" href="assets/fav.png" />
    <title>arkanoid</title>
  </head>
  <body>
    <div id="home-container">
      <img id="logo" src="assets/logo.png" alt="logo" />
      <button id="play">
        <img src="assets/play.svg" alt="" />
        <p>Start Game</p>
      </button>
    </div>

    <div id="game-container">
      <div id="header-container">
        <div id="header-left">
          <button id="settings-btn">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="100%"
              height="100%"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-settings-icon lucide-settings"
            >
              <path
                d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <p id="timer">05:00</p>
        </div>

        <header>
          <p>Score</p>
          <p id="score">0</p>
        </header>
        <div id="header-right">
          <img class="heart" src="assets/heart.png" alt="Heart" />
          <img class="heart" src="assets/heart.png" alt="Heart" />
          <img class="heart" src="assets/heart.png" alt="Heart" />
        </div>
      </div>

      <!-- field-wrap holds the grid + absolutely positioned ball/paddle -->
      <div id="field-wrap">
        <div id="container">
          <div id="pause-menu">
            <div id="resume-btn" class="menu-row">
              <button>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-play-icon lucide-play"
                >
                  <path
                    d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                  />
                </svg>
              </button>
              <p>Resume</p>
            </div>
            <div id="restart-btn" class="menu-row">
              <button>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-rotate-ccw-icon lucide-rotate-ccw"
                >
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
              <p>Restart</p>
            </div>
            <div id="home-btn" class="menu-row">
              <button>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-house-icon lucide-house"
                >
                  <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                  <path
                    d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                  />
                </svg>
              </button>
              <p>Home</p>
            </div>
          </div>
        </div>
        <div id="ball"></div>
        <div id="breaker"></div>
        <p id="press-to-play">Press Space to play</p>
      </div>
    </div>

    <div id="win-container">
      <p id="win-title">You Win!</p>
    </div>
    <div id="over-container">
      <p id="over-title">You Lose!</p>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
